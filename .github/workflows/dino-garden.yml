name: 🦖 Jurassic Garden

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/dino_garden.py, .github/workflows/dino-garden.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 공룡 풀어놓기
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/dino_garden.py ${{ github.repository_owner }} assets/dino-garden.svg
      - name: Commit
        run: |
          git config user.name  "jurassic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dino-garden.svg
          git diff --cached --quiet || git commit -m "🦕 dinos are grazing on fresh grass"
          git push
